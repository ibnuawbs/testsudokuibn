<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>Ibn Sudoku</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#0b1c30",
                        "primary": "#3525cd",
                        "surface": "#f8f9ff",
                        "surface-container": "#e5eeff",
                        "outline-variant": "#c7c4d8",
                    },
                    "keyframes": {
                        "cooldown": { "0%": { width: "0%" }, "100%": { width: "100%" } },
                        "flashGlow": {
                            "0%": { "backgroundColor": "rgba(34, 197, 94, 0.4)", "filter": "brightness(1.2)" },
                            "50%": { "backgroundColor": "rgba(79, 70, 229, 0.3)", "filter": "brightness(1.3)" },
                            "100%": { "filter": "brightness(1)" }
                        }
                    },
                    "animation": {
                        "cooldown": "cooldown 4s linear",
                        "flash": "flashGlow 0.6s ease-in-out"
                    }
                }
            }
        }
    </script>
<style>
        body, button, span, div, h1, h2, h3 { font-family: 'Inter', sans-serif !important; }
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1 !important;
            width: auto; height: auto;
        }
        
        .sudoku-grid-container { aspect-ratio: 1 / 1; }
        .block-border-right { border-right: 4px solid rgba(11, 28, 48, 0.15); }
        .block-border-bottom { border-bottom: 4px solid rgba(11, 28, 48, 0.15); }

        /* HIGHLIGHTING SYSTEM (LIGHT MODE) */
        .cell { background-color: #f8f9ff; color: #0b1c30; font-size: 24px !important; }
        .cell[data-fixed="true"] { color: #0b1c30; font-weight: 700; }
        .cell:not([data-fixed="true"]) { color: #3525cd; font-weight: 400; }
        .cell.highlight-crosshair { background-color: #dce9ff !important; }
        .cell.highlight-same-number { background-color: #a9beff !important; }
        .cell.selected { background-color: #3525cd !important; color: #ffffff !important; z-index: 10; }
        .cell.error-state { background-color: #ba1a1a !important; color: #ffffff !important; z-index: 10; }

        /* PREMIUM SOFT DARK MODE (SLATE THEME) */
        html.dark body { background-color: #0f172a !important; color: #cbd5e1 !important; }
        html.dark header { background-color: #0f172a !important; }
        html.dark .bg-surface-container-lowest { background-color: #1e293b !important; }
        html.dark .bg-surface-container { background-color: #1e293b !important; }
        html.dark .bg-surface-container-high { background-color: #334155 !important; color: #94a3b8 !important; }
        html.dark .text-on-surface-variant { color: #94a3b8 !important; }
        html.dark .bg-outline-variant { background-color: #334155 !important; }
        html.dark .block-border-right { border-right: 4px solid rgba(255, 255, 255, 0.12); }
        html.dark .block-border-bottom { border-bottom: 4px solid rgba(255, 255, 255, 0.12); }

        /* HIGHLIGHTING SYSTEM (DARK MODE) */
        html.dark .cell { background-color: #1e293b; }
        html.dark .cell[data-fixed="true"] { color: #f1f5f9; }
        html.dark .cell:not([data-fixed="true"]) { color: #ffffff; } 
        html.dark .cell.highlight-crosshair { background-color: #243147 !important; } 
        html.dark .cell.highlight-same-number { background-color: #334155 !important; } 
        html.dark .cell.selected { background-color: #4f46e5 !important; color: #ffffff !important; }
        html.dark .cell.error-state { background-color: #7f1d1d !important; color: #fca5a5 !important; }

        .animate-grid-flash { animation: flashGlow 0.6s ease-in-out; }
        #hint-cooldown-bar { display: none; }
        #hint-btn:disabled #hint-cooldown-bar { display: block; }
        .modal-overlay { display: none; position: fixed; inset: 0; background-color: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px); z-index: 50; }
        .modal-overlay.active { display: flex; }
        .paused-board { filter: blur(8px); pointer-events: none; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-status-label overflow-x-hidden transition-colors duration-200">
<header class="flex justify-between items-center px-6 w-full h-16 bg-surface dark:bg-background border-b border-outline-variant/10">
    <h1 class="text-on-surface dark:text-inverse-on-surface font-bold text-[22px] tracking-tight">Ibn Sudoku</h1>
</header>

<main class="flex-1 flex flex-col items-center justify-center p-4 max-w-[1200px] mx-auto w-full">
    <div class="w-full max-w-[500px] mb-4">
        <div class="flex justify-between items-center mb-3 px-1 gap-2">
            <div class="flex items-center gap-1.5 shrink-0">
                <div class="flex items-center gap-1.5 text-on-surface-variant text-[13px] bg-surface-container rounded-full px-3 py-1.5">
                    <span class="material-symbols-outlined text-[18px]">timer</span>
                    <span id="timer" class="font-medium">00:00</span>
                </div>
                <button class="flex items-center justify-center w-9 h-9 rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all active:scale-90" id="pause-btn">
                    <span class="material-symbols-outlined text-[22px]" id="pause-btn-icon">pause</span>
                </button>
            </div>

            <div class="flex items-center gap-2 text-on-surface-variant text-[12px] sm:text-[13px] bg-surface-container rounded-full px-4 py-1.5 font-semibold truncate shadow-sm">
                <span id="game-date-info">--- --</span>
                <span class="opacity-30">|</span>
                <span id="game-level-info">Lvl -</span>
            </div>

            <div class="flex items-center gap-1.5 shrink-0">
                <button class="flex items-center justify-center w-9 h-9 rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all active:scale-90" id="tutorial-btn">
                    <span class="material-symbols-outlined text-[22px]">help_outline</span>
                </button>
                <button class="flex items-center justify-center w-9 h-9 rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all active:scale-90" id="dark-mode-btn">
                    <span class="material-symbols-outlined text-[22px]" id="dark-mode-icon">dark_mode</span>
                </button>
            </div>
        </div>

        <div class="relative">
            <div class="sudoku-grid-container bg-surface-container-lowest shadow-lg rounded-xl overflow-hidden border-2 border-outline-variant transition-all duration-300" id="board-wrapper">
                <div class="grid grid-cols-9 grid-rows-9 h-full w-full bg-outline-variant gap-[1px]" id="sudoku-grid"></div>
            </div>
            
            <div class="absolute inset-0 z-20 hidden flex-col items-center justify-center bg-slate-900/10 rounded-xl backdrop-blur-[3px]" id="pause-overlay">
                <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-2xl flex flex-col items-center gap-5 border border-outline-variant/20 animate-slideUp">
                    <div class="flex flex-col items-center gap-3">
                        <span class="material-symbols-outlined text-primary text-6xl !w-auto !h-auto">pause_circle</span>
                        <h3 class="text-2xl text-on-surface dark:text-white font-bold">Game Paused</h3>
                    </div>
                    <button class="bg-primary hover:bg-primary/90 text-white px-10 py-3.5 rounded-full font-bold transition-all active:scale-95 shadow-lg flex items-center gap-2" id="resume-btn">
                        <span class="material-symbols-outlined text-[24px]">play_arrow</span> Resume
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="w-full max-w-[500px] flex flex-col gap-4">
        <div class="grid grid-cols-9 gap-2" id="number-pad">
            <button class="num-btn aspect-square flex items-center justify-center rounded-xl bg-surface-container text-primary font-bold text-[22px] hover:bg-primary hover:text-white transition-all active:scale-90" data-value="1">1</button>
            <button class="num-btn aspect-square flex items-center justify-center rounded-xl bg-surface-container text-primary font-bold text-[22px] hover:bg-primary hover:text-white transition-all active:scale-90" data-value="2">2</button>
            <button class="num-btn aspect-square flex items-center justify-center rounded-xl bg-surface-container text-primary font-bold text-[22px] hover:bg-primary hover:text-white transition-all active:scale-90" data-value="3">3</button>
            <button class="num-btn aspect-square flex items-center justify-center rounded-xl bg-surface-container text-primary font-bold text-[22px] hover:bg-primary hover:text-white transition-all active:scale-90" data-value="4">4</button>
            <button class="num-btn aspect-square flex items-center justify-center rounded-xl bg-surface-container text-primary font-bold text-[22px] hover:bg-primary hover:text-white transition-all active:scale-90" data-value="5">5</button>
            <button class="num-btn aspect-square flex items-center justify-center rounded-xl bg-surface-container text-primary font-bold text-[22px] hover:bg-primary hover:text-white transition-all active:scale-90" data-value="6">6</button>
            <button class="num-btn aspect-square flex items-center justify-center rounded-xl bg-surface-container text-primary font-bold text-[22px] hover:bg-primary hover:text-white transition-all active:scale-90" data-value="7">7</button>
            <button class="num-btn aspect-square flex items-center justify-center rounded-xl bg-surface-container text-primary font-bold text-[22px] hover:bg-primary hover:text-white transition-all active:scale-90" data-value="8">8</button>
            <button class="num-btn aspect-square flex items-center justify-center rounded-xl bg-surface-container text-primary font-bold text-[22px] hover:bg-primary hover:text-white transition-all active:scale-90" data-value="9">9</button>
        </div>
        
        <div class="flex justify-between items-center bg-surface-container rounded-2xl p-1.5 shadow-inner divide-x divide-outline-variant/60 dark:divide-slate-600/60">
            <button class="flex-1 flex flex-col items-center justify-center text-on-surface-variant py-3 hover:bg-white dark:hover:bg-slate-700 transition-all active:scale-95 rounded-l-xl" id="undo-btn">
                <span class="material-symbols-outlined">undo</span>
                <span class="text-[11px] font-bold mt-1 uppercase tracking-wider">Undo</span>
            </button>
            <button class="flex-1 flex flex-col items-center justify-center text-on-surface-variant py-3 hover:bg-white dark:hover:bg-slate-700 transition-all active:scale-95" id="erase-btn">
                <span class="material-symbols-outlined">backspace</span>
                <span class="text-[11px] font-bold mt-1 uppercase tracking-wider">Erase</span>
            </button>
            <button class="flex-1 flex flex-col items-center justify-center text-on-surface-variant py-3 hover:bg-white dark:hover:bg-slate-700 transition-all active:scale-95 rounded-r-xl relative overflow-hidden group disabled:opacity-70" id="hint-btn">
                <div class="absolute bottom-0 left-0 h-1 bg-primary/60 dark:bg-indigo-400 w-0 animate-cooldown" id="hint-cooldown-bar"></div>
                <span class="material-symbols-outlined">lightbulb</span>
                <span class="text-[11px] font-bold mt-1 uppercase tracking-wider">Hint</span>
            </button>
        </div>
    </div>
</main>

<div class="modal-overlay items-center justify-center p-4 animate-fadeIn" id="tutorial-modal">
    <div class="bg-white max-w-[480px] w-full rounded-3xl shadow-2xl overflow-hidden flex flex-col border border-outline-variant/30">
        <div class="p-6 border-b border-outline-variant flex justify-between items-center">
            <h2 class="text-xl font-bold">How to Play Sudoku</h2>
            <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-all" id="close-modal-top">
                <span class="material-symbols-outlined text-[28px]">close</span>
            </button>
        </div>
        <div class="p-6 overflow-y-auto max-h-[70vh] space-y-5">
            <img class="w-full rounded-2xl mb-2" src="https://lh3.googleusercontent.com/aida/ADBb0uidppCS8iUDf4Dt15yKmYdlRMovyga2_YuVzRQYnDtBhnA6ixzyc6fqUUI8Z2Q4ymvHdspz_dLbEjZ_ulJMEuKqyDD3k0rZoNyS0awowpeAxlGsPz_w82wjZ2OLRb4n04idUlWb2dvRUGcNq5lGfKVEJpuMqpD8eYRu9DRN1WAiwmDP_U90BntmDflZNU6lkIIfWCjkd1h_tO6Fs0QxFifkssDx6wswd_aE4kAHrUXcrZYu5uyi-QKkhg7m">
            <div class="flex gap-4">
                <span class="flex-shrink-0 w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center font-bold text-sm">1</span>
                <p class="text-sm leading-relaxed">Each row, column, and 3x3 box must contain numbers 1-9 without repetition.</p>
            </div>
            <div class="flex gap-4">
                <span class="flex-shrink-0 w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center font-bold text-sm">2</span>
                <p class="text-sm leading-relaxed">Select a cell and use the number pad to fill in your moves.</p>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay items-center justify-center p-4 animate-fadeIn" id="win-modal">
    <div class="bg-white max-w-[400px] w-full rounded-3xl shadow-2xl overflow-hidden p-8 text-center flex flex-col items-center">
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-6">
            <span class="material-symbols-outlined text-green-600 text-5xl">workspace_premium</span>
        </div>
        <h2 class="text-3xl font-bold mb-2">Well Done!</h2>
        <p class="text-slate-500 mb-8">Solved in <span class="font-bold text-primary" id="win-time">00:00</span>.</p>
        <button class="w-full bg-primary hover:bg-primary/90 text-white py-4 rounded-full font-bold transition-all active:scale-95 shadow-lg flex items-center justify-center gap-2" onclick="location.reload()">
            <span class="material-symbols-outlined">refresh</span> Play Again
        </button>
    </div>
</div>

<script>
    let solution = [], clues = [];
    let currentSelectedCell = null, history = [], timerSeconds = 0;
    let hintOnCooldown = false, isPaused = false, timerInterval = null, gameFinished = false;

    const gridElement = document.getElementById('sudoku-grid');
    const boardWrapper = document.getElementById('board-wrapper');
    const pauseOverlay = document.getElementById('pause-overlay');
    const winModal = document.getElementById('win-modal');

    /* FEATURE MAYOR: FETCHING DAILY PUZZLE & FORMATTING HEADER INFO */
    async function muatSoalHarianDariGithub() {
        const busterCache = new Date().getTime();
        const urlRawGithub = `https://raw.githubusercontent.com/ibnuawbs/testsudokuibn/refs/heads/main/soal.json?v=${busterCache}`;
        try {
            const response = await fetch(urlRawGithub, { cache: "no-store" }); 
            const data = await response.json();
            const listSoal = data.puzzles;
            const sekarang = new Date();
            const tanggalHariIni = sekarang.getDate(); 

            let soalHariIni = listSoal.find(soal => parseInt(soal.id) === tanggalHariIni) || listSoal[0];
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    solution.push(soalHariIni.solution[r][c]);
                    clues.push(soalHariIni.puzzle[r][c]);
                }
            }

            const hariStr = tanggalHariIni.toString().padStart(2, '0');
            const bulanStr = (sekarang.getMonth() + 1).toString().padStart(2, '0');
            document.getElementById('game-date-info').textContent = `${hariStr}-${bulanStr}-${sekarang.getFullYear()}`;
            document.getElementById('game-level-info').textContent = `Lvl ${soalHariIni.level}`;

            initGrid();
            startTimer();
        } catch (error) {
            console.error("Gagal memuat soal.");
            location.reload();
        }
    }

    /* FEATURE MAYOR: GRID RENDERING & SELECTION SYSTEM */
    function initGrid() {
        gridElement.innerHTML = '';
        for (let i = 0; i < 81; i++) {
            const cell = document.createElement('div');
            const row = Math.floor(i / 9), col = i % 9;
            cell.className = 'cell flex items-center justify-center cursor-pointer relative transition-all duration-150';
            if ((col + 1) % 3 === 0 && col !== 8) cell.classList.add('block-border-right');
            if ((row + 1) % 3 === 0 && row !== 8) cell.classList.add('block-border-bottom');
            cell.dataset.index = i;
            cell.dataset.correct = solution[i];
            if (clues[i] !== 0) { cell.textContent = clues[i]; cell.dataset.fixed = "true"; }
            cell.addEventListener('click', () => selectCell(cell));
            gridElement.appendChild(cell);
        }
    }

    /* FEATURE MAYOR: HIGHLIGHTING & CROSSHAIR LOGIC */
    function highlightCells(index) {
        const row = Math.floor(index / 9), col = index % 9;
        const cells = gridElement.children;
        const targetValue = cells[index].textContent.trim();

        for (let i = 0; i < 81; i++) {
            const cRow = Math.floor(i / 9), cCol = i % 9;
            const cVal = cells[i].textContent.trim();
            cells[i].classList.remove('highlight-crosshair', 'highlight-same-number');
            if (i === index) continue;
            if (targetValue !== '' && cVal === targetValue) cells[i].classList.add('highlight-same-number');
            else if (cRow === row || cCol === col) cells[i].classList.add('highlight-crosshair');
        }
    }

    function selectCell(cell) {
        if (isPaused || gameFinished) return;
        if (currentSelectedCell) currentSelectedCell.classList.remove('selected');
        cell.classList.add('selected');
        currentSelectedCell = cell;
        highlightCells(parseInt(cell.dataset.index));
    }

    /* FEATURE MAYOR: REWARD ANIMATIONS (LINE/BOX FLASH) */
    function checkGroupFlash(index) {
        const row = Math.floor(index / 9), col = index % 9;
        const bR = Math.floor(row / 3) * 3, bC = Math.floor(col / 3) * 3;
        const cells = gridElement.children;
        let rB = true, cB = true, xB = true;

        for (let i = 0; i < 9; i++) {
            if (parseInt(cells[row * 9 + i].textContent) !== parseInt(cells[row * 9 + i].dataset.correct)) rB = false;
            if (parseInt(cells[i * 9 + col].textContent) !== parseInt(cells[i * 9 + col].dataset.correct)) cB = false;
        }
        for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
            if (parseInt(cells[(bR + r) * 9 + (bC + c)].textContent) !== parseInt(cells[(bR + r) * 9 + (bC + c)].dataset.correct)) xB = false;
        }

        const trigger = (list) => list.forEach(idx => {
            cells[idx].classList.add('animate-grid-flash');
            setTimeout(() => cells[idx].classList.remove('animate-grid-flash'), 600);
        });

        if (rB) trigger([...Array(9).keys()].map(i => row * 9 + i));
        if (cB) trigger([...Array(9).keys()].map(i => i * 9 + col));
        if (xB) {
            let ids = [];
            for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) ids.push((bR + r) * 9 + (bC + c));
            trigger(ids);
        }
    }

    /* FEATURE MAYOR: GAMEPLAY MUTATIONS (INPUT, UNDO, WIN) */
    function inputNumber(val) {
        if (isPaused || gameFinished || !currentSelectedCell || currentSelectedCell.dataset.fixed === "true") return;
        const idx = parseInt(currentSelectedCell.dataset.index);
        history.push({ index: idx, val: currentSelectedCell.textContent, err: currentSelectedCell.classList.contains('error-state') });
        currentSelectedCell.textContent = val;
        if (parseInt(val) === parseInt(currentSelectedCell.dataset.correct)) {
            currentSelectedCell.classList.remove('error-state');
            checkGroupFlash(idx);
            if (Array.from(gridElement.children).every(c => parseInt(c.textContent) === parseInt(c.dataset.correct))) triggerWin();
        } else currentSelectedCell.classList.add('error-state');
        highlightCells(idx);
    }

    function triggerWin() {
        gameFinished = true; clearInterval(timerInterval);
        document.getElementById('win-time').textContent = formatTime(timerSeconds);
        winModal.classList.add('active');
        Array.from(gridElement.children).forEach(c => {
            c.classList.add('animate-grid-flash');
            c.classList.remove('selected', 'highlight-crosshair', 'highlight-same-number');
        });
    }

    function togglePause() {
        if (gameFinished) return;
        isPaused = !isPaused;
        boardWrapper.classList.toggle('paused-board', isPaused);
        pauseOverlay.classList.toggle('hidden', !isPaused);
        pauseOverlay.classList.toggle('flex', isPaused);
        document.getElementById('pause-btn-icon').textContent = isPaused ? 'play_arrow' : 'pause';
    }

    /* FEATURE MAYOR: DARK MODE ENGINE */
    const darkModeBtn = document.getElementById('dark-mode-btn');
    const darkModeIcon = document.getElementById('dark-mode-icon');
    
    function setDark(isDark) {
        document.documentElement.classList.toggle('dark', isDark);
        darkModeIcon.textContent = isDark ? 'light_mode' : 'dark_mode';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    if (localStorage.getItem('theme') === 'dark') setDark(true);
    darkModeBtn.addEventListener('click', () => setDark(!document.documentElement.classList.contains('dark')));

    /* CORE UTILITIES */
    function startTimer() { timerInterval = setInterval(() => { if (!isPaused && !gameFinished) { timerSeconds++; document.getElementById('timer').textContent = formatTime(timerSeconds); } }, 1000); }
    function formatTime(s) { return `${Math.floor(s / 60).toString().padStart(2, '0')}:${(s % 60).toString().padStart(2, '0')}`; }

    // EVENT LISTENERS
    document.querySelectorAll('.num-btn').forEach(b => b.addEventListener('click', () => inputNumber(b.dataset.value)));
    document.getElementById('erase-btn').addEventListener('click', () => { if(currentSelectedCell && currentSelectedCell.dataset.fixed !== "true") { currentSelectedCell.textContent = ''; currentSelectedCell.classList.remove('error-state'); highlightCells(parseInt(currentSelectedCell.dataset.index)); } });
    document.getElementById('undo-btn').addEventListener('click', () => { if(history.length > 0) { const l = history.pop(); const c = gridElement.children[l.index]; c.textContent = l.val; l.err ? c.classList.add('error-state') : c.classList.remove('error-state'); selectCell(c); } });
    
    // FEATURE MAYOR: Logika Tombol Hint Berbasis Petak Yang Dipilih Aktif (Bukan Auto Petak Kosong)
    document.getElementById('hint-btn').addEventListener('click', () => {
        if (hintOnCooldown || isPaused || gameFinished) return;
        
        // Hint hanya merespons jika user memilih petak kosong yang bukan bawaan (fixed)
        if (currentSelectedCell && currentSelectedCell.dataset.fixed !== "true") {
            // Jika petak sudah diisi dengan angka yang benar, jangan konsumsi cooldown hint
            if (parseInt(currentSelectedCell.textContent) === parseInt(currentSelectedCell.dataset.correct)) return;
            
            inputNumber(currentSelectedCell.dataset.correct);
            hintOnCooldown = true; 
            document.getElementById('hint-btn').disabled = true;
            setTimeout(() => { hintOnCooldown = false; document.getElementById('hint-btn').disabled = false; }, 4000);
        }
    });

    document.getElementById('pause-btn').addEventListener('click', togglePause);
    document.getElementById('resume-btn').addEventListener('click', togglePause);
    document.getElementById('tutorial-btn').addEventListener('click', () => { if(!isPaused) togglePause(); document.getElementById('tutorial-modal').classList.add('active'); });
    document.getElementById('close-modal-top').addEventListener('click', () => { document.getElementById('tutorial-modal').classList.remove('active'); if(isPaused) togglePause(); });

    muatSoalHarianDariGithub();
</script>
</body></html>
