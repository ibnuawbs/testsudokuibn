<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>Ibn Sudoku</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#0b1c30",
                        "primary": "#3525cd",
                        "surface": "#f8f9ff",
                        "surface-container": "#e5eeff",
                        "outline-variant": "#c7c4d8",
                    },
                    "keyframes": {
                        "cooldown": { "0%": { width: "0%" }, "100%": { width: "100%" } },
                        "flashGlow": {
                            "0%": { "backgroundColor": "rgba(34, 197, 94, 0.4)", "filter": "brightness(1.2)" },
                            "50%": { "backgroundColor": "rgba(79, 70, 229, 0.3)", "filter": "brightness(1.3)" },
                            "100%": { "filter": "brightness(1)" }
                        }
                    },
                    "animation": {
                        "cooldown": "cooldown 4s linear",
                        "flash": "flashGlow 0.6s ease-in-out"
                    }
                }
            }
        }
    </script>
<style>
        body, button, span, div, h1, h2, h3, p { font-family: 'Inter', sans-serif !important; }
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1 !important;
            width: auto; height: auto;
        }
        
        .sudoku-grid-container { aspect-ratio: 1 / 1; }
        .block-border-right { border-right: 4px solid rgba(11, 28, 48, 0.15); }
        .block-border-bottom { border-bottom: 4px solid rgba(11, 28, 48, 0.15); }

        /* HIGHLIGHTING SYSTEM */
        .cell { background-color: #f8f9ff; color: #0b1c30; font-size: 24px !important; }
        .cell[data-fixed="true"] { color: #0b1c30; font-weight: 700; }
        .cell:not([data-fixed="true"]) { color: #3525cd; font-weight: 400; }
        .cell.highlight-crosshair { background-color: #dce9ff !important; }
        .cell.highlight-same-number { background-color: #a9beff !important; }
        .cell.selected { background-color: #3525cd !important; color: #ffffff !important; z-index: 10; }
        .cell.error-state { background-color: #ba1a1a !important; color: #ffffff !important; z-index: 10; }

        /* SOFT DARK MODE THEME */
        html.dark body { background-color: #0f172a !important; color: #cbd5e1 !important; }
        html.dark header { background-color: #0f172a !important; }
        html.dark .bg-surface-container-lowest { background-color: #1e293b !important; }
        html.dark .bg-surface-container { background-color: #1e293b !important; }
        html.dark .bg-surface-container-high { background-color: #334155 !important; color: #94a3b8 !important; }
        html.dark .text-on-surface-variant { color: #94a3b8 !important; }
        html.dark .bg-outline-variant { background-color: #334155 !important; }
        html.dark .block-border-right { border-right: 4px solid rgba(255, 255, 255, 0.12); }
        html.dark .block-border-bottom { border-bottom: 4px solid rgba(255, 255, 255, 0.12); }

        html.dark .cell { background-color: #1e293b; }
        html.dark .cell[data-fixed="true"] { color: #f1f5f9; }
        html.dark .cell:not([data-fixed="true"]) { color: #ffffff; } 
        html.dark .cell.highlight-crosshair { background-color: #243147 !important; } 
        html.dark .cell.highlight-same-number { background-color: #334155 !important; } 
        html.dark .cell.selected { background-color: #4f46e5 !important; color: #ffffff !important; }
        html.dark .cell.error-state { background-color: #7f1d1d !important; color: #fca5a5 !important; }

        .animate-grid-flash { animation: flashGlow 0.6s ease-in-out; }
        #hint-cooldown-bar { display: none; }
        #hint-btn:disabled #hint-cooldown-bar { display: block; }
        .modal-overlay { display: none; position: fixed; inset: 0; background-color: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px); z-index: 50; }
        .modal-overlay.active { display: flex; }
        .paused-board { filter: blur(8px); pointer-events: none; }

        /* CSS Sudoku Diagram for Tutorial */
        .tutorial-diagram-cell { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border: 1px solid #c7c4d8; font-weight: bold; color: #0b1c30; background-color: #f8f9ff; }
        html.dark .tutorial-diagram-cell { border-color: #334155; color: #f1f5f9; background-color: #1e293b; }
        
        /* Highlight styles */
        .tutorial-highlight-block { background-color: rgba(53, 37, 205, 0.15) !important; }
        .tutorial-highlight-row-col { background-color: rgba(53, 37, 205, 0.08) !important; }
        .tutorial-fixed-cell { font-weight: bold; color: #3525cd !important; }
        html.dark .tutorial-fixed-cell { color: #4f46e5 !important; }

    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col overflow-x-hidden transition-colors duration-200">
<header class="flex justify-between items-center px-6 w-full h-16 bg-surface dark:bg-background border-b border-outline-variant/10">
    <h1 class="text-on-surface dark:text-inverse-on-surface font-bold text-[22px] tracking-tight">Ibn Sudoku</h1>
</header>

<main class="flex-1 flex flex-col items-center justify-center p-4 max-w-[1200px] mx-auto w-full">
    <div class="w-full max-w-[500px] mb-4">
        <div class="flex justify-between items-center mb-3 px-1 gap-2">
            <div class="flex items-center gap-1.5 shrink-0">
                <div class="flex items-center gap-1.5 text-on-surface-variant text-[13px] bg-surface-container rounded-full px-3 py-1.5">
                    <span class="material-symbols-outlined text-[18px]">timer</span>
                    <span id="timer" class="font-medium">00:00</span>
                </div>
                <button class="flex items-center justify-center w-9 h-9 rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all active:scale-90" id="pause-btn">
                    <span class="material-symbols-outlined text-[22px]" id="pause-btn-icon">pause</span>
                </button>
            </div>

            <div class="flex items-center gap-2 text-on-surface-variant text-[12px] sm:text-[13px] bg-surface-container rounded-full px-4 py-1.5 font-semibold truncate">
                <span id="game-level-info">Lvl --</span>
            </div>

            <div class="flex items-center gap-1.5 shrink-0">
                <button class="flex items-center justify-center w-9 h-9 rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all active:scale-90" id="tutorial-btn">
                    <span class="material-symbols-outlined text-[22px]">help_outline</span>
                </button>
                <button class="flex items-center justify-center w-9 h-9 rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all active:scale-90" id="dark-mode-btn">
                    <span class="material-symbols-outlined text-[22px]" id="dark-mode-icon">dark_mode</span>
                </button>
            </div>
        </div>

        <div class="relative">
            <div class="sudoku-grid-container bg-surface-container-lowest shadow-lg rounded-xl overflow-hidden border-2 border-outline-variant transition-all duration-300" id="board-wrapper">
                <div class="grid grid-cols-9 grid-rows-9 h-full w-full bg-outline-variant gap-[1px]" id="sudoku-grid"></div>
            </div>
            
            <div class="absolute inset-0 z-20 hidden flex-col items-center justify-center bg-slate-900/10 rounded-xl backdrop-blur-[3px]" id="pause-overlay">
                <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-2xl flex flex-col items-center gap-5 border border-outline-variant/20 animate-slideUp">
                    <div class="flex flex-col items-center gap-3">
                        <span class="material-symbols-outlined text-primary text-6xl !w-16 !h-16 flex items-center justify-center">pause_circle</span>
                        <h3 class="text-2xl text-on-surface dark:text-white font-bold">Game Paused</h3>
                    </div>
                    <button class="bg-primary hover:bg-primary/90 text-white px-10 py-3.5 rounded-full font-bold transition-all active:scale-95 shadow-lg flex items-center gap-2" id="resume-btn">
                        <span class="material-symbols-outlined text-[24px]">play_arrow</span> Resume
                    </button>
                </div>
            </div>

            <div class="absolute inset-0 z-20 hidden flex-col items-center justify-center bg-slate-900/40 rounded-xl backdrop-blur-[4px]" id="daily-lock-overlay">
                <div class="bg-white dark:bg-slate-800 p-6 mx-4 rounded-3xl shadow-2xl flex flex-col items-center gap-4 border border-outline-variant/20 text-center max-w-[360px]">
                    <span class="material-symbols-outlined text-amber-500 text-5xl">lock</span>
                    <h3 class="text-xl text-on-surface dark:text-white font-bold">Tantangan Selesai!</h3>
                    <p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed">Kamu sudah menyelesaikan game hari ini. Silakan kembali besok untuk level baru berikutnya!</p>
                </div>
            </div>
        </div>
    </div>

    <div class="w-full max-w-[500px] flex flex-col gap-4" id="controls-wrapper">
        <div class="grid grid-cols-9 gap-2" id="number-pad">
            <button class="num-btn aspect-square flex items-center justify-center rounded-xl bg-surface-container text-primary font-bold text-[22px] hover:bg-primary hover:text-white transition-all active:scale-90" data-value="1">1</button>
            <button class="num-btn aspect-square flex items-center justify-center rounded-xl bg-surface-container text-primary font-bold text-[22px] hover:bg-primary hover:text-white transition-all active:scale-90" data-value="2">2</button>
            <button class="num-btn aspect-square flex items-center justify-center rounded-xl bg-surface-container text-primary font-bold text-[22px] hover:bg-primary hover:text-white transition-all active:scale-90" data-value="3">3</button>
            <button class="num-btn aspect-square flex items-center justify-center rounded-xl bg-surface-container text-primary font-bold text-[22px] hover:bg-primary hover:text-white transition-all active:scale-90" data-value="4">4</button>
            <button class="num-btn aspect-square flex items-center justify-center rounded-xl bg-surface-container text-primary font-bold text-[22px] hover:bg-primary hover:text-white transition-all active:scale-90" data-value="5">5</button>
            <button class="num-btn aspect-square flex items-center justify-center rounded-xl bg-surface-container text-primary font-bold text-[22px] hover:bg-primary hover:text-white transition-all active:scale-90" data-value="6">6</button>
            <button class="num-btn aspect-square flex items-center justify-center rounded-xl bg-surface-container text-primary font-bold text-[22px] hover:bg-primary hover:text-white transition-all active:scale-90" data-value="7">7</button>
            <button class="num-btn aspect-square flex items-center justify-center rounded-xl bg-surface-container text-primary font-bold text-[22px] hover:bg-primary hover:text-white transition-all active:scale-90" data-value="8">8</button>
            <button class="num-btn aspect-square flex items-center justify-center rounded-xl bg-surface-container text-primary font-bold text-[22px] hover:bg-primary hover:text-white transition-all active:scale-90" data-value="9">9</button>
        </div>
        
        <div class="flex justify-between items-center bg-surface-container rounded-2xl p-1.5 shadow-inner divide-x divide-outline-variant/60 dark:divide-slate-600/60">
            <button class="flex-1 flex flex-col items-center justify-center text-on-surface-variant py-3 hover:bg-white dark:hover:bg-slate-700 transition-all active:scale-95 rounded-l-xl" id="undo-btn">
                <span class="material-symbols-outlined">undo</span>
                <span class="text-[11px] font-bold mt-1 uppercase tracking-wider">Undo</span>
            </button>
            <button class="flex-1 flex flex-col items-center justify-center text-on-surface-variant py-3 hover:bg-white dark:hover:bg-slate-700 transition-all active:scale-95" id="erase-btn">
                <span class="material-symbols-outlined">backspace</span>
                <span class="text-[11px] font-bold mt-1 uppercase tracking-wider">Erase</span>
            </button>
            <button class="flex-1 flex flex-col items-center justify-center text-on-surface-variant py-3 hover:bg-white dark:hover:bg-slate-700 transition-all active:scale-95 rounded-r-xl relative overflow-hidden group disabled:opacity-70" id="hint-btn">
                <div class="absolute bottom-0 left-0 h-1 bg-primary/60 dark:bg-indigo-400 w-0 animate-cooldown" id="hint-cooldown-bar"></div>
                <span class="material-symbols-outlined">lightbulb</span>
                <span class="text-[11px] font-bold mt-1 uppercase tracking-wider">Hint</span>
            </button>
        </div>
    </div>
</main>

<div class="modal-overlay items-center justify-center p-4 transition-opacity duration-300" id="tutorial-modal">
    <div class="bg-white dark:bg-slate-800 max-w-[480px] w-full rounded-3xl shadow-2xl overflow-hidden flex flex-col border border-outline-variant/30 dark:border-slate-700 animate-slideUp">
        <div class="p-6 border-b border-outline-variant/30 dark:border-slate-700 flex justify-between items-center">
            <h2 class="text-xl font-bold dark:text-white">How to Play Sudoku</h2>
            <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-
